services:
  - type: web
    name: factory-monitor-dashboard-api-kranklee
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: factory-monitor-dashboard-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: '["https://kranklee.github.io"]'
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: factory-monitor-dashboard-db
    plan: free
    region: oregon
    databaseName: factory_monitor
    user: factory_monitor
